[package]
name = "ct-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = [ "tokio", "wgpu" ] }
bytemuck = { version = "1.25.2", features = [ "derive" ] }
serde = { version = "1.0.229", features = [ "derive", "rc" ] }
rfd = { version = "0.17.2", features = [ "xdg-portal" ] }
tokio = { version = "1.53.1", features = [ "fs" ] }
image = "0.25.10"
env_logger = "0.11.11"
log = "0.4.34"
serde_json = "1.0.151"
futures = "0.3.34"
